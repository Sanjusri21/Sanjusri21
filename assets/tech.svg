<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <linearGradient id="techNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="techBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>

    <filter id="techGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .tech-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.25em;
        fill: url(#techNeon);
      }
      .tech-sub {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.28em;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="916" height="76" rx="10" fill="url(#techBg)" stroke="url(#techBorder)" stroke-width="1.2" />

  <!-- Accent Decors -->
  <g opacity="0.4">
    <path d="M 20 40 L 90 40 L 105 25 L 140 25" fill="none" stroke="#00F0FF" stroke-width="1" />
    <circle cx="20" cy="40" r="2" fill="#00F0FF" />
    <circle cx="140" cy="25" r="2" fill="#00F0FF" />

    <path d="M 900 40 L 830 40 L 815 55 L 780 55" fill="none" stroke="#A855F7" stroke-width="1" />
    <circle cx="900" cy="40" r="2" fill="#A855F7" />
    <circle cx="780" cy="55" r="2" fill="#A855F7" />
  </g>

  <!-- Center Content -->
  <g transform="translate(460, 36)" text-anchor="middle" filter="url(#techGlow)">
    <text class="tech-title">⚡ TECHNICAL ARCHITECTURE &amp; TOOLKIT</text>
  </g>
  <g transform="translate(460, 58)" text-anchor="middle">
    <text class="tech-sub">LANGUAGES • AI &amp; VISION • FULL STACK • IOT &amp; CLOUD</text>
  </g>

  <!-- Corner cyber ticks -->
  <path d="M 10 18 L 10 10 L 18 10" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" />
  <path d="M 910 18 L 910 10 L 902 10" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" />
  <path d="M 10 62 L 10 70 L 18 70" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" />
  <path d="M 910 62 L 910 70 L 902 70" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" />
</svg>
